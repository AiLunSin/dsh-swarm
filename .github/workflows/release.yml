name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package-name:
        description: npm package name for the release variant
        type: string
        required: false
        default: '@ailunsin/dsh-swarm'
      dry-run:
        description: Build and test without publishing
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: ${{ inputs['package-name'] || '@ailunsin/dsh-swarm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Syntax and tests
        run: |
          node scripts/check-syntax.mjs
          npm test
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package version $VERSION" >&2
            exit 1
          fi
      - name: Build renamed release variant
        run: |
          node scripts/build-release.mjs --name "$PACKAGE_NAME" --out dist/release
          echo "RELEASE_DIR=dist/release" >> "$GITHUB_ENV"
      - name: Package check
        run: |
          cd "$RELEASE_DIR"
          npm pack --dry-run
      - name: Demo
        run: node scripts/demo.mjs
      - name: Publish to npm
        if: github.event_name == 'workflow_dispatch' && inputs['dry-run'] != true
        run: |
          cd "$RELEASE_DIR"
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs['dry-run'] != true && startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
